<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Subscribe to Our Newsletter</title>
  <style>
    :root { color-scheme:light; --ink:#18372d; --muted:#596b64; --green:#176249; --line:#dce7e1; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; min-width:0; min-height:100vh; min-height:100svh; padding:32px 24px; display:flex; align-items:center; justify-content:center; background:#f2f6f3; color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei",sans-serif; -webkit-text-size-adjust:100%; }
    .container { width:100%; max-width:640px; min-width:0; margin:auto; padding:36px 40px; border:1px solid var(--line); border-top:5px solid var(--green); border-radius:20px; background:#fff; box-shadow:0 18px 50px #17392b12; overflow-wrap:anywhere; }
    .brand { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding-bottom:24px; margin-bottom:26px; border-bottom:1px solid var(--line); }
    .brand-mark { flex:0 0 44px; height:44px; display:grid; place-items:center; border-radius:12px; background:var(--green); color:#fff; font-size:25px; font-weight:700; }
    .brand-name { display:block; font-size:20px; font-weight:700; }
    .brand-caption { display:block; font-size:12px; color:var(--muted); }
    h1 { margin:0 0 14px; font-size:clamp(26px,4vw,32px); line-height:1.3; }
    .lead { margin:0 0 24px; color:var(--muted); }
    .form-group { margin-bottom:20px; }
    .form-group>label { display:block; margin-bottom:8px; font-weight:600; }
    input[type=email],input[type=text] { display:block; width:100%; min-width:0; min-height:52px; padding:12px 14px; border:1px solid #b7c9bf; border-radius:10px; font:inherit; font-size:16px; background:#fbfcfb; color:var(--ink); }
    input:focus,button:focus-visible,a:focus-visible { outline:3px solid #b4d6c4; outline-offset:2px; }
    .lists { padding:0; margin:0 0 24px; list-style:none; }
    .lists label { display:flex; align-items:flex-start; gap:12px; padding:12px; margin-top:10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
    input[type=checkbox] { width:22px; height:22px; flex:0 0 22px; margin:2px 0 0; accent-color:var(--green); }
    h3 { margin:20px 0 10px; font-size:17px; }
    button { display:block; width:100%; min-height:52px; padding:12px 16px; border:0; border-radius:10px; background:var(--green); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    .footer { padding-top:22px; margin-top:28px; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:14px; }
    .footer a { color:var(--green); }
    @media(max-width:600px) { body { padding:20px 14px; } .container { padding:26px 22px; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand" aria-label="LeadPilot AI">
      <span class="brand-mark" aria-hidden="true">L</span>
      <div><span class="brand-name">LeadPilot AI</span><span class="brand-caption">LeadPilot Smart Mail</span></div>
    </header>
    <h1>Stay connected</h1>
    <p class="lead">Subscribe for product news and business updates from LeadPilot AI.</p>
    <form method="post" action="" class="form">
      <input id="token" type="hidden" name="token" value="{{.CSRFToken}}" />
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" required type="email" placeholder="you@company.com" autocomplete="email" inputmode="email" />
      </div>
      <div class="form-group">
        <label for="name">Name (Optional)</label>
        <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" />
      </div>
      <h3 data-public-groups-label>Choose your subscription</h3>
      <ul class="lists">
        {{range $_, $group := .Groups}}
        <li><label for="l-{{$group.Id}}"><input checked id="l-{{$group.Id}}" type="checkbox" name="group_ids" value="{{$group.Id}}" /><span data-no-public-translate>{{$group.Name}}</span></label></li>
        {{end}}
      </ul>
      <button type="submit">Subscribe Now</button>
    </form>
    <footer class="footer">Powered by <a href="https://github.com/dwjacken-star/LeadPilotAI" target="_blank" rel="noopener noreferrer">LeadPilot AI</a></footer>
  </main>
  <script src="/leadpilot-public-layout.js"></script>
  <script src="/leadpilot-public-i18n.js"></script>
</body>
</html>
