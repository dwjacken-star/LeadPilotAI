<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Confirm Your Subscription | LeadPilot AI</title>
  <style>
    :root { color-scheme:light; --ink:#18372d; --muted:#596b64; --green:#176249; --line:#dce7e1; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; min-width:0; min-height:100vh; min-height:100svh; padding:32px 24px; display:flex; align-items:center; justify-content:center; background:#f2f6f3; color:var(--ink); font:18px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei",sans-serif; -webkit-text-size-adjust:100%; }
    .container { width:100%; max-width:640px; min-width:0; margin:auto; padding:36px 40px; border:1px solid var(--line); border-top:5px solid var(--green); border-radius:20px; background:white; box-shadow:0 18px 50px #17392b12; overflow-wrap:anywhere; }
    .brand { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding-bottom:24px; margin-bottom:26px; border-bottom:1px solid var(--line); }
    .brand-mark { flex:0 0 44px; height:44px; display:grid; place-items:center; border-radius:12px; background:var(--green); color:white; font-size:25px; font-weight:700; }
    .brand-name { display:block; font-size:20px; font-weight:700; }
    .brand-caption { display:block; font-size:12px; color:var(--muted); }
    h1 { margin:0 0 18px; font-size:clamp(26px,4vw,32px); line-height:1.3; }
    p { margin:0 0 18px; color:var(--muted); }
    .email-info { margin:22px 0; padding:16px; border:1px solid var(--line); border-radius:12px; background:#f2f6f3; }
    .footer { padding-top:22px; margin-top:28px; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:14px; }
    .footer a { color:var(--green); }
    @media(max-width:600px) { body { padding:20px 14px; } .container { padding:26px 22px; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand" aria-label="LeadPilot AI"><span class="brand-mark" aria-hidden="true">L</span><div><span class="brand-name">LeadPilot AI</span><span class="brand-caption">LeadPilot Smart Mail</span></div></header>
    <h1>Please Check Your Email</h1>
    <p>We sent an email to you. Please click the link in the email to finish signing up.</p>
    <div class="email-info"><span>Email:</span> <span id="subscriber-email" data-no-public-translate>{{.EmailAddress}}</span></div>
    <p>If you don't get the email, please check your spam folder or try again later.</p>
    <footer class="footer">Powered by <a href="https://github.com/dwjacken-star/LeadPilotAI" target="_blank" rel="noopener noreferrer">LeadPilot AI</a></footer>
  </main>
  <script src="/leadpilot-public-layout.js"></script>
  <script src="/leadpilot-public-i18n.js"></script>
</body>
</html>
